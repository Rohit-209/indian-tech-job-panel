# ATS company tokens the collector will hit each day.
#
# How to add a company:
#   Greenhouse: check https://boards-api.greenhouse.io/v1/boards/{token}/jobs
#   Lever:      check https://api.lever.co/v0/postings/{token}?mode=json
#   Ashby:      check https://api.ashbyhq.com/posting-api/job-board/{token}
#
# Probe first with: python -m tools.probe_tokens
# Broken/stale tokens return 404 and pollute the log.
