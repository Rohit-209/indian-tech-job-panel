# A3 pre-registration — machine-readable. analysis/a3_drift.py reads this file
# and nothing else for its design choices. Written 2026-10-18 (panel day 42),
# before any period-2 posting exists. Do not edit after the commit that adds
# it; any deviation goes in report/A3_preregistration.md under "Deviations"
# with a date and reason.

registered_on: 2026-10-18
skills_dictionary_version: 1   # extraction/skills.yaml; a later version is applied to BOTH periods by replay

periods:                        # IST calendar dates, inclusive, by ATS publish date
  p1: {start: 2026-09-07, end: 2026-09-27}   # panel weeks 1–3
  p2: {start: 2026-11-09, end: 2026-11-29}   # panel weeks 10–12
earliest_run_date: 2026-12-01   # allows a day for p2's last postings to be collected

population: >-
  In-scope postings (extraction.titles.in_scope: technical IC roles) whose
  ATS publish date (Greenhouse first_published / Ashby publishedAt) falls
  inside the period. Each posting belongs to at most one period. Title
  family uses whichever classifier the pipeline uses on the run date.

primary:
  id: H1
  outcome: any_genai          # posting mentions at least one skill below
  genai_skills: [llm, genai, ai_agents, rag, prompt_engineering, langchain,
                 fine_tuning, embeddings, evals, openai_api, hugging_face]
  test: two-proportion z-test, two-sided
  alpha: 0.05
  effect: p2 - p1 in percentage points, Newcombe hybrid-score 95% CI
  composition_adjusted: Mantel–Haenszel odds ratio stratified by company (companies with postings in both periods)
  baseline_p1_open_stock: 0.31     # share among in-scope postings open in weeks 1–3, for context
  minimum_detectable_effect_pp: 29 # 80% power at n ≈ 42 vs 45, baseline 0.3

secondary:
  per_skill:
    selection_rule: >-
      skills present in >= 15% of in-scope postings open at any time in
      weeks 1–3 (n = 201). Chosen from period-1 data only.
    skills: [ci_cd, python, aws, code_review, java, observability,
             distributed_systems, sre, kubernetes, go, identity, git,
             javascript, docker, postgresql, ai_agents, react, terraform,
             rest, typescript, agile, gcp, sql, event_driven, ruby,
             data_viz, salesforce]
    test: two-proportion z-test per skill, two-sided
    multiplicity: {method: benjamini_hochberg, q: 0.05, family: all 27 skills, report: raw and adjusted p}
    effect: percentage-point difference, Newcombe 95% CI, ranked by |difference|
  trend:
    model: logistic regression, any_genai ~ weeks since 2026-09-07 + company fixed effects
    sample: in-scope postings published 2026-09-07 → 2026-11-29 (all 12 weeks)
    report: odds ratio per 4 weeks with 95% CI (HC1 SEs)
  stable_panel:
    rule: H1 recomputed on companies with >= 1 population posting in both periods

interpretation_rules:
  - A non-significant H1 is reported as "no shift larger than about 29 pp detected", not "no drift".
  - Per-skill results are exploratory; only BH-surviving skills are described as shifted.
  - If H1's raw and composition-adjusted estimates disagree in sign, the composition-adjusted one is reported as the finding.
