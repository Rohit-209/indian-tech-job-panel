# Canonical skills dictionary for posting_skills.
#
# Each skill is a canonical slug with a category and one or more matchers.
# Matching runs over clean_text(title + description). Word boundaries are
# applied automatically: the match can't be preceded by a letter/digit/_ or
# followed by a letter/digit/_/+/#, so `java` never fires on "JavaScript"
# and `c` never fires on "C++".
#
# Matcher keys (any combination):
#   aliases:     case-insensitive literals. The default; use for anything
#                unambiguous (kubernetes, pytorch).
#   exact:       case-sensitive literals. For words that are also English
#                ("React" the library vs "react" the verb, "dbt", "Helm").
#   listed:      case-sensitive AND only inside an enumeration — next to a
#                comma, slash, parenthesis, or and/or/in/with/using. For tokens
#                too short to trust anywhere else: Go, R, C. Never fires when
#                followed by "-", "&", " to" (Go-to-market, R&D, C-suite).
#   pattern:     raw Python regex, case-sensitive unless it starts with (?i).
#                Last resort; add a test for every one.
#   suppress_for: employer names (lowercase, as in postings.company). Postings
#                from these employers never get this skill, because they name
#                their own product in boilerplate. Otherwise MongoDB tops the
#                database ranking simply because MongoDB is hiring.
#
# Bump `version` on any change; the extractor replays all postings each run,
# so posting_skills always reflects exactly one dictionary version.

version: 1

skills:
