[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-tech-job-panel"
version = "0.1.0"
description = "A longitudinal panel of Indian tech job postings"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
extraction = [
    "google-genai>=2.0",
    "rapidfuzz>=3.10",
]
analysis = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lifelines>=0.29",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "umap-learn>=0.5",
    "jupyterlab>=4.2",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.setuptools]
packages = ["collectors", "extraction", "db", "quality", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
