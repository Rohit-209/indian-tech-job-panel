name: daily-collect

on:
  schedule:
    # 02:30 UTC = 08:00 IST. Runs every day.
    - cron: '30 2 * * *'
  workflow_dispatch:      # manual trigger for debugging

concurrency:
  # Prevent a slow run and the next scheduled run from stepping on each other.
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      COLLECTOR_CONTACT_EMAIL: ${{ secrets.COLLECTOR_CONTACT_EMAIL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run collectors
        run: python run_collectors.py

      - name: Run assertions
        if: always()   # run even if collectors non-zero, so we see DB-state
        run: python -m quality.assertions

      - name: Run monitor
        if: always()
        run: python -m quality.monitor
